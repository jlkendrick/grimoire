<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Grimoire — a spellbook for your codebase">
  <title>Grimoire</title>
  <desc>A polyglot meta-runtime and declarative execution framework — a spellbook for your codebase.</desc>

  <defs>
    <!-- Stone background -->
    <radialGradient id="stoneBg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#3a3024"/>
      <stop offset="55%" stop-color="#2a241c"/>
      <stop offset="100%" stop-color="#0c0a07"/>
    </radialGradient>

    <!-- Subtle grain on top of stone -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.13   0 0 0 0 0.10   0 0 0 0 0.06   0 0 0 0.55 0"/>
    </filter>

    <!-- Book front-cover leather -->
    <radialGradient id="cover" cx="32%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#7a4226"/>
      <stop offset="42%" stop-color="#4a1f10"/>
      <stop offset="100%" stop-color="#1d0a05"/>
    </radialGradient>

    <!-- Soft gold glow halo behind book -->
    <radialGradient id="goldGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#d4a84a" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#d4a84a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d4a84a" stop-opacity="0"/>
    </radialGradient>

    <!-- Embered title glow -->
    <filter id="titleGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#a87a2e" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Slight drop shadow for pentacle lines -->
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <!-- Vignette overlay -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- ====== STONE BACKDROP ====== -->
  <rect width="1280" height="380" fill="url(#stoneBg)"/>
  <rect width="1280" height="380" filter="url(#grain)" opacity="0.35"/>
  <rect width="1280" height="380" fill="url(#vignette)"/>

  <!-- ====== ORNATE FRAME ====== -->
  <rect x="8" y="8" width="1264" height="364" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="14" y="14" width="1252" height="352" fill="none" stroke="#3b3024" stroke-width="1"/>
  <rect x="20" y="20" width="1240" height="340" fill="none" stroke="#a87a2e" stroke-width="0.5" opacity="0.55"/>

  <!-- Corner bosses -->
  <g>
    <circle cx="28" cy="28" r="6" fill="#776044" stroke="#1a140c" stroke-width="0.8"/>
    <circle cx="26.5" cy="26.5" r="1.5" fill="#a87a2e" opacity="0.7"/>
    <circle cx="1252" cy="28" r="6" fill="#776044" stroke="#1a140c" stroke-width="0.8"/>
    <circle cx="1250.5" cy="26.5" r="1.5" fill="#a87a2e" opacity="0.7"/>
    <circle cx="28" cy="352" r="6" fill="#776044" stroke="#1a140c" stroke-width="0.8"/>
    <circle cx="26.5" cy="350.5" r="1.5" fill="#a87a2e" opacity="0.7"/>
    <circle cx="1252" cy="352" r="6" fill="#776044" stroke="#1a140c" stroke-width="0.8"/>
    <circle cx="1250.5" cy="350.5" r="1.5" fill="#a87a2e" opacity="0.7"/>
  </g>

  <!-- Side "vine" dots -->
  <g fill="#3a3020" opacity="0.7">
    <circle cx="50" cy="80"  r="3"/>
    <circle cx="50" cy="135" r="3"/>
    <circle cx="50" cy="190" r="3"/>
    <circle cx="50" cy="245" r="3"/>
    <circle cx="50" cy="300" r="3"/>
    <circle cx="1230" cy="80"  r="3"/>
    <circle cx="1230" cy="135" r="3"/>
    <circle cx="1230" cy="190" r="3"/>
    <circle cx="1230" cy="245" r="3"/>
    <circle cx="1230" cy="300" r="3"/>
  </g>

  <!-- ====== THE BOOK ====== -->
  <g transform="translate(260, 192)">
    <!-- Halo behind book -->
    <ellipse cx="0" cy="20" rx="170" ry="135" fill="url(#goldGlow)"/>

    <!-- Front cover -->
    <rect x="-88" y="-128" width="176" height="256" fill="url(#cover)" stroke="#1a0a04" stroke-width="2" rx="2"/>
    <!-- Outer gold trim -->
    <rect x="-78" y="-118" width="156" height="236" fill="none" stroke="#a87a2e" stroke-width="1.1"/>
    <!-- Inner gold trim -->
    <rect x="-73" y="-113" width="146" height="226" fill="none" stroke="#d4a84a" stroke-width="0.4" opacity="0.7"/>

    <!-- Pentacle sigil -->
    <g transform="translate(0,-4)" filter="url(#goldShadow)">
      <circle cx="0" cy="0" r="46" fill="none" stroke="#d4a84a" stroke-width="1.3"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#a87a2e" stroke-width="0.6"/>
      <path d="M 0,-34 L 20,28 L -32,-11 L 32,-11 L -20,28 Z"
            fill="none" stroke="#d4a84a" stroke-width="1.4" stroke-linejoin="round"/>
    </g>

    <!-- Runic flourishes above & below pentacle -->
    <g font-family="'IM Fell English', Georgia, serif" font-size="10" fill="#d4a84a" opacity="0.85">
      <text x="0" y="-82" text-anchor="middle" letter-spacing="2">ᚠ · ᚢ · ᚦ · ᚨ</text>
      <text x="0" y="96"  text-anchor="middle" letter-spacing="2">ᚱ · ᚲ · ᚷ · ᚹ</text>
    </g>

    <!-- Title plate on the cover -->
    <g transform="translate(0, 60)">
      <line x1="-46" y1="0" x2="46" y2="0" stroke="#a87a2e" stroke-width="0.6" opacity="0.7"/>
      <text x="0" y="14" text-anchor="middle"
            font-family="'UnifrakturCook','IM Fell English', Georgia, serif"
            font-weight="700" font-size="15" fill="#d4a84a" letter-spacing="3">GRIMOIRE</text>
      <line x1="-46" y1="22" x2="46" y2="22" stroke="#a87a2e" stroke-width="0.6" opacity="0.7"/>
    </g>

    <!-- Clasp -->
    <rect x="83" y="-16" width="9" height="32" fill="#d4a84a" stroke="#1a0a04" stroke-width="0.8"/>
    <rect x="83" y="-16" width="9" height="32" fill="#000" opacity="0.25"/>
    <circle cx="87.5" cy="0" r="1.8" fill="#1a0a04"/>
  </g>

  <!-- ====== TITLE BLOCK ====== -->
  <g transform="translate(430, 118)">
    <!-- Eyebrow (split around a drawn 4-point star so we don't depend on
         emoji/symbol font support for the ✦ glyph) -->
    <text x="0" y="0"
          font-family="'IM Fell English SC','IM Fell English', Georgia, serif"
          font-size="13" letter-spacing="5" fill="#a87a2e">A POLYGLOT META-RUNTIME</text>
    <path d="M 315,-4 L 317,-1.2 L 320,0 L 317,1.2 L 315,4 L 313,1.2 L 310,0 L 313,-1.2 Z"
          fill="#a87a2e"/>
    <text x="333" y="0"
          font-family="'IM Fell English SC','IM Fell English', Georgia, serif"
          font-size="13" letter-spacing="5" fill="#a87a2e">DECLARATIVE EXECUTION FRAMEWORK</text>

    <!-- Main title: UnifrakturCook-Bold "Grimoire" as embedded vector paths.
         Extracted from the OFL font so it renders identically wherever the
         SVG is loaded, with no font dependency. font-size equivalent: 118. -->
    <g transform="translate(0,108)" filter="url(#titleGlow)">
      <g transform="scale(0.057617,-0.057617)" fill="#e9dcba">
        <path transform="translate(0,0)" d="M1114 1081Q1328 910 1445 714Q1217 249 745 31Q75 301 75 848Q75 888 79 929Q391 1381 771 1535Q979 1390 1340 1297ZM751 1249Q742 1148 742.0 1070.0Q742 992 744 939Q799 990 857.0 1041.0Q915 1092 970 1145Q884 1212 751 1249ZM746 890Q751 769 765 649Q661 630 520 512Q602 437 707.5 375.0Q813 313 905 313Q931 313 957 317Q1122 344 1142 464Q1147 496 1147 526Q1147 610 1108.0 675.5Q1069 741 980.0 803.5Q891 866 746 890ZM446 585Q472 642 476 716L485 1064Q486 1109 455 1180Q439 1166 426 1147Q335 1025 335 873Q335 708 446 585Z"/>
        <path transform="translate(1472,0)" d="M395 934 525 1066Q726 927 797 784L637 570Q610 649 563.5 709.0Q517 769 409 832L376 787L357 446Q354 394 423.0 338.0Q492 282 530 266L364 31L54 272Q110 339 112 410L110 794Q107 842 36 890L187 1080Z"/>
        <path transform="translate(2283,0)" d="M29 890 180 1080 404 975Q392 934 378.0 895.0Q364 856 364 815L350 409Q350 404 350 400Q350 353 380.0 322.0Q410 291 449 275L249 31L37 202Q95 271 95 340L102 794Q102 842 29 890ZM59 1089 139 1484 436 1365Z"/>
        <path transform="translate(2753,0)" d="M410 931 529 1080 785 891 936 1080 1255 849 1225 731 1212 409Q1212 404 1212 400Q1212 353 1242.0 322.0Q1272 291 1310 275L1110 31Q1036 89 996.5 134.0Q957 179 957 319Q957 329 957 340L964 710Q964 750 857 841L816 770L801 409Q801 406 801 403Q801 354 831.0 322.5Q861 291 900 275L700 31L487 202Q544 269 546 340L552 710Q552 754 435 849L376 779L367 409Q366 356 396.5 323.5Q427 291 466 275L266 31L55 202Q112 271 112 340L120 794Q120 842 46 890L197 1080L410 932Z"/>
        <path transform="translate(4103,0)" d="M80 801Q313 957 467 1084Q544 1051 622 966Q791 785 822 588Q826 565 826 544Q826 478 789 437L457 14L29 225Q97 366 97 469L95 702Q92 774 80 801ZM349 836 346 411Q355 362 415.0 334.5Q475 307 494.5 307.0Q514 307 521 309Q609 329 609 420Q609 441 604 467Q570 632 505.5 716.5Q441 801 349 836Z"/>
        <path transform="translate(4967,0)" d="M29 890 180 1080 404 975Q392 934 378.0 895.0Q364 856 364 815L350 409Q350 404 350 400Q350 353 380.0 322.0Q410 291 449 275L249 31L37 202Q95 271 95 340L102 794Q102 842 29 890ZM59 1089 139 1484 436 1365Z"/>
        <path transform="translate(5437,0)" d="M395 934 525 1066Q726 927 797 784L637 570Q610 649 563.5 709.0Q517 769 409 832L376 787L357 446Q354 394 423.0 338.0Q492 282 530 266L364 31L54 272Q110 339 112 410L110 794Q107 842 36 890L187 1080Z"/>
        <path transform="translate(6248,0)" d="M520 31 41 222Q68 372 68.0 534.5Q68 697 37 874L382 1077V1080L384 1079H385L774 800L369 374Q410 325 460.0 320.0Q510 315 542.5 315.0Q575 315 619.5 318.5Q664 322 729 324Q676 250 624.0 177.0Q572 104 520 31ZM354 810Q296 810 296 652Q296 562 326 472Q326 463 329 457L490 627Q507 645 507.0 663.0Q507 681 489.5 709.0Q472 737 454 755Q391 810 354 810Z"/>
      </g>
    </g>

    <!-- Decorative divider with drawn 4-point star in the middle -->
    <g transform="translate(0, 138)">
      <line x1="0"   y1="0" x2="245" y2="0" stroke="#a87a2e" stroke-width="0.8" opacity="0.85"/>
      <line x1="275" y1="0" x2="520" y2="0" stroke="#a87a2e" stroke-width="0.8" opacity="0.85"/>
      <path d="M 260,-7 L 263,-2 L 268,0 L 263,2 L 260,7 L 257,2 L 252,0 L 257,-2 Z"
            fill="#a87a2e"/>
    </g>

    <!-- Tagline -->
    <text x="0" y="180"
          font-family="'Cormorant Garamond','IM Fell English', Georgia, serif"
          font-style="italic" font-size="24" fill="#cfc196" letter-spacing="0.5">
      &#8220;A spellbook for your codebase.&#8221;
    </text>

    <!-- Subline -->
    <text x="0" y="216"
          font-family="Georgia, serif" font-size="14" fill="#8a7a5a" letter-spacing="0.4">
      Write pure business logic in any tongue. Weave it into a typed CLI. Cast it from anywhere.
    </text>
  </g>
</svg>
